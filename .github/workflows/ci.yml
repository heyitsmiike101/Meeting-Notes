name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux audio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - name: Install project
        run: python -m pip install -e ".[client,server,dev]"
      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: meeting-notes:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-app:
    name: Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[client,build]"
      - name: Build executable
        run: >-
          python -m nuitka --standalone --windows-console-mode=disable
          --enable-plugin=pyside6 --include-package=meeting_notes
          --include-package=soundcard
          --include-package-data=soundcard
          --output-dir=dist --output-filename=MeetingNotes.exe
          --assume-yes-for-downloads
          windows_client.py
      - name: Normalize package directory
        shell: pwsh
        run: Move-Item -LiteralPath "dist/windows_client.dist" -Destination "dist/MeetingNotes"
      - name: Smoke test packaged client
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/MeetingNotes/MeetingNotes.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged client self-test failed with code $($process.ExitCode)"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: MeetingNotes-Windows
          path: dist/MeetingNotes/
