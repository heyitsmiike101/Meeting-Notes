name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[client,build]"
      - run: >-
          python -m nuitka --standalone --windows-console-mode=disable
          --enable-plugin=pyside6 --include-package=meeting_notes
          --include-package=soundcard
          --include-package-data=soundcard
          --output-dir=dist --output-filename=MeetingNotes.exe
          --assume-yes-for-downloads
          windows_client.py
      - name: Normalize package directory
        shell: pwsh
        run: Move-Item -LiteralPath "dist/windows_client.dist" -Destination "dist/MeetingNotes"
      - name: Smoke test packaged client
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/MeetingNotes/MeetingNotes.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged client self-test failed with code $($process.ExitCode)"
          }
      - run: Compress-Archive -Path dist/MeetingNotes/* -DestinationPath MeetingNotes-Windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: MeetingNotes-Windows.zip
          generate_release_notes: true
