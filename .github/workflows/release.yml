name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[client,build]"
      - run: >-
          pyinstaller --noconfirm --clean --windowed --name MeetingNotes
          meeting_notes/client/app.py
      - run: Compress-Archive -Path dist/MeetingNotes/* -DestinationPath MeetingNotes-Windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: MeetingNotes-Windows.zip
          generate_release_notes: true
