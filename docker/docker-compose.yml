# Runs the transcription server on the LAN machine that has CPU to spare.
# The recorder client (elsewhere on the network) points at this host on
# port 8000. See ../meeting_notes/server/ and the Dockerfile in this
# directory for what actually runs.
services:
  meeting-notes-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INSTALL_DIARIZATION: ${INSTALL_DIARIZATION:-false}
    ports:
      - "8000:8000"
    volumes:
      - ${MEETING_NOTES_DATA_MOUNT:-meeting-notes-data}:/data
      # Downloaded Whisper weights (HF_HOME in the Dockerfile). Separate from
      # the recordings volume so wiping one never costs you the other.
      - ${MEETING_NOTES_MODELS_MOUNT:-meeting-notes-models}:/models
    environment:
      # Shared secret the recorder client must send as
      # `Authorization: Bearer <token>` (or `?token=` on the websocket).
      # Leaving this unset runs with NO authentication -- fine for a quick
      # local test, loudly logged as insecure, not recommended left that way
      # on a shared LAN. Set it via a `.env` file next to this compose file
      # (MEETING_NOTES_TOKEN=...) rather than committing a real value here.
      - MEETING_NOTES_TOKEN=${MEETING_NOTES_TOKEN:-}
      # faster-whisper model size/name (e.g. base.en, small.en,
      # large-v3-turbo -- see meeting_notes/transcribe/faster_whisper_backend.py
      # for the curated choices). Unset disables transcription: the server
      # still records the stream and stores uploads, per meeting_notes/server's
      # module docs, it just can't produce a transcript until this is set.
      # This is only the BOOTSTRAP value: it seeds <data>/settings.json the
      # first time the server starts with no settings file yet, but once an
      # operator changes the model via the /settings page (or PUT
      # /v1/settings), the file wins from then on -- changing this env var
      # afterwards has no effect until settings.json is deleted.
      - MEETING_NOTES_MODEL=${MEETING_NOTES_MODEL:-base.en}
      - MEETING_NOTES_DEVICE=cpu
      - MEETING_NOTES_DATA=/data
      - MEETING_NOTES_SERVER_ADDRESS=${MEETING_NOTES_SERVER_ADDRESS:-}
      - MEETING_NOTES_DIARIZATION=${MEETING_NOTES_DIARIZATION:-false}
      - MEETING_NOTES_DIARIZATION_DEVICE=${MEETING_NOTES_DIARIZATION_DEVICE:-cpu}
      # Needed only when diarization is enabled. Accept the Community-1 model
      # terms first, then put the token in docker/.env (never commit it).
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
    restart: unless-stopped

volumes:
  meeting-notes-data:
  meeting-notes-models:
