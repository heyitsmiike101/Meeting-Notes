[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-notes"
dynamic = ["version"]
description = "Dual-track meeting audio recorder (your mic + system audio) with pluggable transcription"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21",
    "soundcard>=0.4.2",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1,<2"]
# The desktop recorder. Deliberately does NOT depend on faster-whisper: the
# laptop records and streams, the server does the compute.
client = [
    "PySide6-Essentials>=6.10.3,<6.11",
    "httpx>=0.24",
    "websockets>=12",
    # macOS only: ScreenCaptureKit system audio, CoreAudio/NSWorkspace call
    # detection, Trash. Never installed (or imported) on Windows/Linux.
    "pyobjc-core>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10; sys_platform == 'darwin'",
]
# The transcription server: receives the live stream and the final upload,
# runs faster-whisper against them. Deliberately separate from `client` --
# the server is the only side that ever needs the model itself.
server = [
    "fastapi>=0.100",
    "httpx>=0.24",
    "uvicorn[standard]>=0.23",
    "websockets>=12",
    "python-multipart>=0.0.6",
    "faster-whisper>=1.1,<2",
    "mcp>=2.2,<3; python_version >= '3.10'",
    # Named time zones for the Notion month pages (TZ=America/New_York); slim images ship no zoneinfo.
    "tzdata>=2024.1",
]
bridge = ["httpx>=0.24"]
diarization = ["pyannote.audio>=4,<5"]
dev = ["pytest>=7"]
build = ["Nuitka>=2.8,<3", "ordered-set>=4,<5", "zstandard>=0.23,<1"]

[project.scripts]
meeting-notes = "meeting_notes.cli:main"
meeting-notes-ui = "meeting_notes.client.app:main"
meeting-notes-bridge = "meeting_notes.bridge:main"

[tool.setuptools.packages.find]
include = ["meeting_notes*"]

[tool.setuptools.package-data]
meeting_notes = ["bridge/*.md", "bridge/*.json", "server/static/fonts/*", "server/static/app.css", "server/static/splitmerge.css", "server/static/icons.js", "client/ui/fonts/*"]

[tool.setuptools.dynamic]
version = {attr = "meeting_notes.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs a real Whisper model download; opt in with MEETING_NOTES_SLOW_TESTS=1",
]
